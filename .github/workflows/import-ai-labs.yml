name: Import AI lab solutions
on:
  push:
    branches: [main]
    paths:
      - "lab3-6_bundle.zip.b64"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract lab folders
        run: |
          base64 -d lab3-6_bundle.zip.b64 > /tmp/labs.zip
          unzip -o /tmp/labs.zip -d .
          rm lab3-6_bundle.zip.b64
          rm .github/workflows/import-ai-labs.yml
      - name: Commit extracted folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add AI lab solutions for Labs 3-6"
          git push
